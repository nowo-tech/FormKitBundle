services:
  # REQ-SF-003: form types and type extensions are tagged by FrameworkBundle autoconfiguration
  # (FormTypeInterface -> form.type, FormTypeExtensionInterface -> form.type_extension); no manual tags here.
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Nowo\FormKitBundle\Form\Constraint\ConstraintDefinitionFactory: ~

  Nowo\FormKitBundle\Form\FormOptionsMerger:
    arguments:
      $profiles: '%nowo_form_kit.profiles%'
      $defaultProfileName: '%nowo_form_kit.default_profile%'
      $formRegistry: '@?form.registry'
      $formTypeMap: '@Nowo\FormKitBundle\Form\FormTypeMapInterface'
      $translator: '@?translator'

  Nowo\FormKitBundle\Form\FormTypeMap:
    arguments:
      $typeMap: '%nowo_form_kit.type_map%'

  Nowo\FormKitBundle\Css\CssClassUtilities:
    arguments:
      $framework: '%nowo_form_kit.css_framework%'

  Nowo\FormKitBundle\Form\MultiStepFormBuilder: ~
  Nowo\FormKitBundle\Form\MultiStepWizardSessionFactory: ~

  Nowo\FormKitBundle\Form\CsrfOnlyFormFactory: ~
  Nowo\FormKitBundle\Form\GetFilterFormFactory: ~

  # Ports (REQ-ARCH-001 rule 1): autowire the interface; alias it to your own service to replace the default.
  Nowo\FormKitBundle\Form\Constraint\ConstraintDefinitionFactoryInterface:
    alias: Nowo\FormKitBundle\Form\Constraint\ConstraintDefinitionFactory

  Nowo\FormKitBundle\Form\FormOptionsMergerInterface:
    alias: Nowo\FormKitBundle\Form\FormOptionsMerger

  Nowo\FormKitBundle\Form\FormTypeMapInterface:
    alias: Nowo\FormKitBundle\Form\FormTypeMap

  Nowo\FormKitBundle\Css\CssClassUtilitiesInterface:
    alias: Nowo\FormKitBundle\Css\CssClassUtilities

  Nowo\FormKitBundle\Form\MultiStepFormBuilderInterface:
    alias: Nowo\FormKitBundle\Form\MultiStepFormBuilder

  Nowo\FormKitBundle\Form\MultiStepWizardSessionFactoryInterface:
    alias: Nowo\FormKitBundle\Form\MultiStepWizardSessionFactory

  Nowo\FormKitBundle\Form\CsrfOnlyFormFactoryInterface:
    alias: Nowo\FormKitBundle\Form\CsrfOnlyFormFactory

  Nowo\FormKitBundle\Form\GetFilterFormFactoryInterface:
    alias: Nowo\FormKitBundle\Form\GetFilterFormFactory

  Nowo\FormKitBundle\HelpModal\HelpModalNonceInterface:
    alias: Nowo\FormKitBundle\HelpModal\HelpModalNonce

  Nowo\FormKitBundle\Form\Type\CsrfOnlyType:

  Nowo\FormKitBundle\Form\Type\HiddenFieldsCsrfType:

  Nowo\FormKitBundle\Form\Type\SearchQueryType:

  Nowo\FormKitBundle\Form\Type\TranslatableMapType:
    arguments:
      $locales: '%nowo_form_kit.locale_tabs.locales%'
      $defaultLocale: '%nowo_form_kit.locale_tabs.default_locale%'

  Nowo\FormKitBundle\Form\Extension\InputGroupExtension:

  Nowo\FormKitBundle\Form\Extension\LocaleTabsExtension:

  # 2.21: visible_when option on every field (UiKit visible-when row_attr + PRE_SUBMIT keeper).
  Nowo\FormKitBundle\Form\Extension\VisibleWhenExtension: ~

  Nowo\FormKitBundle\Form\Extension\CheckboxRowExtension:
    arguments:
      $profiles: '%nowo_form_kit.profiles%'
      $defaultProfileName: '%nowo_form_kit.default_profile%'
      $cssFramework: '%nowo_form_kit.css_framework%'

  # 2.22: opt-in field widgets rendered by @NowoFormKitBundle/form/field_widgets_theme.html.twig.
  Nowo\FormKitBundle\Form\Extension\ChoiceCardsExtension: ~

  Nowo\FormKitBundle\Form\Extension\SwitchExtension: ~

  Nowo\FormKitBundle\Form\Extension\CharCounterExtension:
    arguments:
      $metadataFactory: '@?validator'

  Nowo\FormKitBundle\Form\Extension\RequiredLabelSuffixExtension:
    arguments:
      $profiles: '%nowo_form_kit.profiles%'
      $defaultProfileName: '%nowo_form_kit.default_profile%'

  Nowo\FormKitBundle\Form\Extension\HelpModalExtension:
    arguments:
      $profiles: '%nowo_form_kit.profiles%'
      $defaultProfileName: '%nowo_form_kit.default_profile%'
      $iconRenderer: '@?Symfony\UX\Icons\IconRendererInterface'
      $nonce: '@Nowo\FormKitBundle\HelpModal\HelpModalNonceInterface'

  # REQ-SEC-004 (L1): per-request nonce binding help-modal payloads to the page; stored in request attributes.
  Nowo\FormKitBundle\HelpModal\HelpModalNonce:
    arguments:
      $requestStack: '@?request_stack'

  # REQ-SEC-004 (L3): responses that reused the nonce header are private + Vary (autoconfigured kernel.event_subscriber).
  Nowo\FormKitBundle\HelpModal\HelpModalNonceResponseListener: ~

  # nowo_form_kit_help_modal_meta() / nowo_form_kit_help_modal_nonce() (twig/twig is a hard dependency).
  Nowo\FormKitBundle\Twig\HelpModalTwigExtension: ~
