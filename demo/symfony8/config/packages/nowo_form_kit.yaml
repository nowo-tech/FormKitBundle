# Form Kit Bundle — demo configuration (see bundle docs: docs/CONFIGURATION.md).
#
# Top-level:
#   default_profile — Config block used when a form does not call setFormKitConfigName().
#   type_map       — Optional snake_case => FQCN; merged with built-in and optional UX types.
#   profiles        — Named profiles (translation domain, defaults, help_modal, field_types).

nowo_form_kit:
    default_profile: default

    # Optional: extra types for FormKitTrait / snake_case fields (uncomment if you add custom types).
    # type_map:
    #     my_custom: 'App\Form\Type\MyCustomType'

    profiles:
        default:
            alias: default
            translation_domain: messages

            # Suffix for required field labels (RequiredLabelSuffixExtension reads `default_profile` only).
            required_label_suffix: ' *'

            defaults:
                attr:
                    class: 'form-control'
                row_attr:
                    class: 'mb-3'

            # Defaults when help_modal: true on a field (HelpModalExtension + public/help-modal.js).
            help_modal:
                framework: bootstrap5
                icon_html: '<span class="nowo-help-modal-icon" aria-hidden="true">?</span>'

            # Per field type: attr, row_attr, label, placeholder, help, translation_domain (see CONFIGURATION.md).
            field_types:
                checkbox:
                    attr:
                        class: 'form-check-input'
                    row_attr:
                        class: 'form-check mb-3'
                choice:
                    placeholder: false
                    attr:
                        class: ''

        # Second profile — used by NamedConfigDemoType via setFormKitConfigName('bootstrap').
        bootstrap:
            alias: bootstrap
            translation_domain: messages
            required_label_suffix: ' *'
            defaults:
                attr:
                    class: 'form-control form-control-lg'
                row_attr:
                    class: 'mb-3'
            help_modal:
                framework: bootstrap5
                icon_html: '<span class="nowo-help-modal-icon" aria-hidden="true">?</span>'
            field_types: {}

# Legacy (single implicit config without `profiles`): supported but not used in this demo.
# nowo_form_kit:
#     translation_domain: messages
#     required_label_suffix: null
#     help_modal: { framework: bootstrap5, icon_html: '<span class="nowo-help-modal-icon" aria-hidden="true">?</span>' }
