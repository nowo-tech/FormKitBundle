twig:
  globals:
    demo_enabled_locales: '%kernel.enabled_locales%'
  form_themes:
    # Form Kit partial theme first (lowest priority); UiKit's form theme (REQ-DEMO-015) wins for the core widgets.
    - '@NowoFormKitBundle/form/static_blocks.html.twig'
    - '@NowoPhoneInputBundle/Form/phone_input_widget.html.twig'
    - '@FOSCKEditor/Form/ckeditor_widget.html.twig'
    - '@NowoUiKit/form/nowo_ui_layout.html.twig'
    # Select All Choice on top of UiKit's theme (its own theme would re-import Symfony's base blocks over UiKit's).
    - 'form/demo_theme.html.twig'
