  locale_tabs:
    page_title: 'Sprach-Tabs - Form Kit Demo'
    heading: 'Sprach-Tabs'
    intro: 'FormKit 2.13 rendert sprachabhängige Felder über UiKit 2.5 (Partial <code>locale_tabs</code>) als einen Tab pro Sprache: WAI-ARIA-Tabs (Pfeile, Pos1 / Ende), gestapelte Fieldsets ohne JavaScript, Markierungen für Pflicht <code>*</code> und Standard <code>★</code>, fehlerhafte Tabs mit <code>!</code> markiert und geöffnet, der Browser öffnet das verborgene Panel eines ungültigen Felds. Das letzte Feld nutzt das neutrale FormKit-Markup (<code>ui_kit: false</code>).'
    show_errors: 'Validierungsfehler anzeigen'
    reset: 'Zurücksetzen'
  translations:
    page_title: 'Übersetzungen - Form Kit Demo'
    heading: Übersetzungen
    intro: 'A2lix <code>TranslationsFormsType</code> mit <code>form_type</code> = TranslationItemType. <code>TranslationsDemoType</code> implementiert <code>resolveFormKitTranslationsLocaleContext()</code> und nutzt <code>DemoTranslationLocales::forSession()</code>: eine <strong>zufällige Teilmenge</strong> der Sprachen (<code>en</code>, <code>es</code>, <code>fr</code>, <code>de</code>) wird in der Session gespeichert, damit sich die Tab-Anzahl zwischen Sessions ändert, GET/POST aber konsistent bleiben. <code>DemoTranslatableItem::forLocales()</code> entspricht diesen Schlüsseln.'
    locale_pool_hint: 'Aktive Sprachen in dieser Session: %pool%.'
    reshuffle: 'Neue zufällige Auswahl'
  nested:
    page_title: 'Verschachteltes Formular - Form-Kit-Demo'
    heading: 'Verschachteltes Formular'
    intro: 'Formular mit eingebettetem Unterformular: Kontakt (Name, E-Mail) + Adresse (Straße, Hausnummer, Etage, Postleitzahl, Stadt, Provinz). Dieselben Form-Kit-Konventionen für übergeordneten und verschachtelten Typ.'
