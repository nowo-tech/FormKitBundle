    sample_missing_body: 'Legen Sie ein Bild unter <code>public/images/demo-sample.jpg</code> ab, um den Cropper auszuprobieren (z. B. eine beliebige JPG-Datei dorthin kopieren oder <code>cp public/images/demo-sample.png public/images/demo-sample.jpg</code> ausführen, falls Sie ein PNG haben).'
