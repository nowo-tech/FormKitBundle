  form_type:
    page_title: 'FormType-Beispiel - Form-Kit-Demo'
    heading: 'FormType-Beispiel'
    intro: 'In <code>App\Form\DemoContactType</code> mit <code>FormOptionsTrait</code> definiertes Formular. Layout: Abschnitte und zweispaltiges Raster, um zu zeigen, wie dasselbe Formular übersichtlich strukturiert werden kann.'
    usage_1: '<code>DemoContactType</code> verwendet <code>FormOptionsTrait</code> und <code>buildFormFromArray()</code>; <code>FormOptionsMerger</code> wird vom Compiler-Pass des Bundles injiziert.'
    usage_2: 'Konvention: Labels, Platzhalter und Hilfetexte stammen aus den Schlüsseln <code>demo_contact.field.label</code>, <code>.placeholder</code>, <code>.help</code> in der konfigurierten Übersetzungsdomäne.'
    usage_3: 'Keine manuelle Konfiguration jedes Typs nötig: ein Formulartyp mit dem Trait und den Übersetzungen erledigt den Rest.'
  controller_form:
    page_title: 'Controller-Formular-Beispiel - Form-Kit-Demo'
    heading: 'Controller-Formular-Beispiel'
    intro: 'Form built in <code>FormKitDemoController::createControllerForm()</code> with <code>FormKitControllerTrait</code> helpers (<code>addTextType</code>, …, <code>addSwitchType</code>). Same convention-based labels/placeholders; layout: two columns + full-width message + switch.'
    usage_1: 'Der Controller injiziert <code>FormOptionsMerger</code> und <code>FormTypeMap</code> und ruft die <code>add*Type()</code>-Helfer auf (gleiche Zusammenführung wie bei FormTypes mit dem Trait).'
    usage_2: 'Convention: keys <code>controller_contact.name</code>, <code>.email</code>, <code>.message</code>, <code>.notify_switch.*</code> for label/placeholder/help.'
    usage_3: 'Nützlich, wenn das Formular im Controller aufgebaut wird (ohne FormType-Klasse), Sie aber dieselben Bundle-Konventionen nutzen möchten.'
  search:
    page_title: 'Suchformular - Form-Kit-Demo'
    heading: 'Suchformular'
    intro: 'Suchleiste in einer Zeile nach den Form-Kit-Konventionen (<code>search_form.*</code>). Dasselbe Formular, anderes Layout: eine einzelne Leiste mit Filter und Aktion.'
