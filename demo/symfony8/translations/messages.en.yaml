demo_contact:
  notice_contact: 'Please fill in your contact details below. All fields in this section are used to get in touch.'
  terms_notice: 'You must accept the terms to continue.'
  full_name:
    label: Full name
    placeholder: Enter your full name
    help: As shown on your ID.
  email_address:
    label: Email address
    placeholder: you@example.com
    help: We will not share it.
  message:
    label: Message
    placeholder: Your message...
    help: Optional.
  password:
    label: Password
    placeholder: Enter password
    help: At least 8 characters.
  website:
    label: Website
    placeholder: https://example.com
    help: Your personal or company URL.
  age:
    label: Age
    placeholder: "0"
    help: Your age in years.
  score:
    label: Score
    placeholder: "0.0"
    help: A number between 0 and 10.
  accept_terms:
    label: I accept the terms
    placeholder: ""
    help: Required to continue.
  topic:
    label: Topic
    placeholder: Choose one
    help: What is your request about?
  help_modal:
    full_name_title: 'Full name'
    full_name_content: '<p>Use your legal name as it appears on your ID or passport. The help icon next to the label opens this modal.</p>'

# Dropzone demo — keys: dropzone_demo.*
dropzone_demo:
  document:
    label: Upload a file
    placeholder: Drag and drop a file or click to browse
    help: Max size and allowed types depend on server config.

# Search form — keys: search_form.*
search_form:
  q:
    label: Search
    placeholder: Type to search...
    help: ""
  category:
    label: Category
    placeholder: All categories
    help: Filter by category.

# Example form (card layout) — keys: example_form.*
example_form:
  name:
    label: Your name
    placeholder: John Doe
    help: ""
  email:
    label: Email
    placeholder: john@example.com
    help: ""
  subject:
    label: Subject
    placeholder: What is this about?
    help: ""
  message:
    label: Message
    placeholder: Your message...
    help: ""

# Form built in the controller — keys: controller_contact.*
controller_contact:
  name:
    label: Your name
    placeholder: Enter your name
    help: How we should call you.
  email:
    label: Email
    placeholder: email@example.com
    help: We will reply to this address.
  message:
    label: Message
    placeholder: Write your message...
    help: Optional.
  notify_switch:
    label: Email notifications
    placeholder: ""
    help: 'Bootstrap <code>form-switch</code> via <code>FormKitControllerTrait::addSwitchType()</code> (same preset as <code>FormOptionsTrait::addSwitchType()</code> on the Data transformers page).'
  topic:
    label: Topic
    placeholder: ""
    help: '<code>addSelectType()</code> on the controller trait.'
  priority:
    label: Priority
    placeholder: ""
    help: '<code>addChoiceRadiosType()</code>.'
  budget_cents:
    label: Budget
    placeholder: ""
    help: '<code>addMoneyType()</code> — model cents, view decimal.'

# Nested form demo — keys: nested_form_demo.*
nested_form_demo:
  full_name:
    label: Full name
    placeholder: Your name
    help: ""
  email:
    label: Email
    placeholder: email@example.com
    help: ""
  address:
    label: Address
    placeholder: ""
    help: Nested AddressType form.

# Data transformers demo — keys: data_transformers_demo.*
data_transformers_demo:
  price_cents:
    label: 'Price (stored as cents)'
    placeholder: '19.99'
    help: 'Model: integer cents. View: decimal string (<code>MoneyModelTransformer</code>).'
  metadata:
    label: 'Metadata (JSON)'
    placeholder: ""
    help: 'Model: array. View: JSON string (<code>JsonModelTransformer</code>).'
  tags:
    label: Tags
    placeholder: 'php, symfony, form'
    help: 'Model: list of strings. View: CSV (<code>CsvModelTransformer</code>).'
  published:
    label: Published
    placeholder: ""
    help: 'Model: 1/0. View: checkbox (<code>BoolModelTransformer</code>).'
  notify_on:
    label: 'Email notifications'
    placeholder: ""
    help: 'Model: 1/0. View: switch (<code>SwitchModelTransformer</code>).'

# Conditional fields demo — keys: conditional_fields_demo.* / build_time_conditional_demo.*
conditional_fields_demo:
  account_type:
    label: Account type
    placeholder: ""
    help: 'Driving field — <code>PRE_SET_DATA</code> / <code>PRE_SUBMIT</code> add company or person fields.'
  company_name:
    label: Company name
    placeholder: Acme Ltd
    help: 'Shown when account type is <strong>company</strong>.'
  first_name:
    label: First name
    placeholder: Jane
    help: 'Shown when account type is <strong>individual</strong>.'
  last_name:
    label: Last name
    placeholder: Doe
    help: 'Shown when account type is <strong>individual</strong>.'

build_time_conditional_demo:
  account_type:
    label: Account type (fixed)
    placeholder: ""
    help: 'Set via form option <code>account_mode</code> at build time (disabled in UI).'
  company_name:
    label: Company name
    placeholder: Acme Ltd
    help: 'Added only when <code>account_mode === company</code>.'
  first_name:
    label: First name
    placeholder: Jane
    help: 'Added only when <code>account_mode === individual</code>.'
  last_name:
    label: Last name
    placeholder: Doe
    help: 'Added only when <code>account_mode === individual</code>.'

