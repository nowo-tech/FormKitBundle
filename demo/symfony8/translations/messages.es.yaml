demo_pages:
  layout:
    default_title: 'Demo Form Kit Bundle'
  common:
    back: Volver
    submit: Enviar
    save: Guardar
    submitted: Enviado
    finish: Finalizar
    next: Siguiente
    start_over: Empezar de nuevo
    collected_data: 'Datos recogidos'
    bundle_usage: 'Uso del bundle'
    crop: Recortar
  index:
    title: 'Demo Form Kit Bundle'
    intro: 'Opciones de formulario por convención con diseños flexibles. Cada tarjeta enlaza a una página con el formulario y una explicación de cómo está construido con el bundle.'
  index_cards:
    form_type:
      title: FormType
      description: '<code>DemoContactType</code> con <code>FormOptionsTrait</code>. Secciones y cuadrícula.'
      button: 'Abrir FormType'
    controller_form:
      title: 'Formulario en controlador'
      description: 'Construido en el controlador con <code>FormKitControllerTrait</code> (texto, email, textarea, <strong>interruptor</strong>). Dos columnas.'
      button: 'Abrir formulario en controlador'
    search:
      title: 'Búsqueda'
      description: 'Barra de búsqueda: consulta + categoría. Convención <code>search_form.*</code>.'
      button: 'Abrir búsqueda'
    example_form:
      title: 'Formulario de ejemplo'
      description: 'Tarjeta con cuadrícula: nombre, email, asunto, mensaje y acciones.'
      button: 'Abrir ejemplo'
    dropzone:
      title: 'Dropzone (UX)'
      description: 'Symfony UX Dropzone: subida de archivos por arrastre.'
      button: 'Abrir Dropzone'
    cropper:
      title: 'Recorte (UX)'
      description: 'Symfony UX Cropper.js: recorta una imagen con relación fija.'
      button: 'Abrir recorte'
    translations:
      title: Traducciones
      description: 'Campos por idioma con pestañas. Un form_class por idioma.'
      button: 'Abrir traducciones'
    nested:
      title: 'Formulario anidado'
      description: 'Contacto + dirección embebida. Convenciones Form Kit para tipos anidados.'
      button: 'Abrir anidado'
    data_transformers:
      title: 'Transformadores de datos'
      description: 'Dinero, JSON, CSV, booleano e interruptor con transformadores de modelo de <code>FormOptionsTrait</code>.'
      button: 'Abrir transformadores'
    choice_fields:
      title: 'Campos de elección'
      description: 'Select, multiselect, radios, casillas, «Seleccionar todo» con <code>nowo-tech/select-all-choice-bundle</code> y helper de autocompletado (FQCN).'
      button: 'Abrir campos de elección'
    ckeditor:
      title: CKEditor
      description: 'FOSCKEditorBundle (CKEditor 4): texto enriquecido con <code>addCKEditorField()</code> y configuraciones de barra.'
      button: 'Abrir CKEditor'
    ux_autocomplete:
      title: Autocompletado
      description: '<strong>Symfony UX Autocomplete</strong> (Tom Select): <code>ChoiceType</code> con <code>autocomplete =&gt; true</code> y <code>addAutocompleteField()</code>.'
      button: 'Abrir autocompletado'
    multistep:
      title: 'Varios pasos'
      description: 'Asistente desde un array: contacto → dirección → confirmar. Pasos en sesión.'
      button: 'Abrir varios pasos'
  form_type:
    page_title: 'Ejemplo FormType - Demo Form Kit'
    heading: 'Ejemplo FormType'
    intro: 'Formulario en <code>App\Form\DemoContactType</code> con <code>FormOptionsTrait</code>. Diseño por secciones y cuadrícula.'
    usage_1: '<code>DemoContactType</code> usa <code>FormOptionsTrait</code> y <code>buildFormFromArray()</code>; <code>FormOptionsMerger</code> lo inyecta el compiler pass del bundle.'
    usage_2: 'Convención: etiquetas, placeholders y ayuda desde <code>demo_contact.campo.label</code>, <code>.placeholder</code>, <code>.help</code> en el dominio de traducción.'
    usage_3: 'No hace falta configurar cada tipo a mano: un FormType con el trait y las traducciones cubren el resto.'
  controller_form:
    page_title: 'Formulario en controlador - Demo Form Kit'
    heading: 'Formulario en controlador'
    intro: 'Formulario en <code>FormKitDemoController::createControllerForm()</code> con helpers de <code>FormKitControllerTrait</code> (<code>addTextType</code>, …, <code>addSwitchType</code>). Mismas convenciones; dos columnas + mensaje a ancho completo + interruptor.'
    usage_1: 'El controlador inyecta <code>FormOptionsMerger</code> y <code>FormTypeMap</code> y usa <code>add*Type()</code> (misma fusión que los FormType con el trait).'
    usage_2: 'Convención: claves <code>controller_contact.name</code>, <code>.email</code>, <code>.message</code>, <code>.notify_switch.*</code> para etiqueta/placeholder/ayuda.'
    usage_3: 'Útil cuando el formulario se crea en el controlador (sin clase FormType) pero quieres las mismas convenciones del bundle.'
  search:
    page_title: 'Búsqueda - Demo Form Kit'
    heading: 'Búsqueda'
    intro: 'Barra de búsqueda con convenciones Form Kit (<code>search_form.*</code>). Mismo formulario, otro diseño: barra con filtro y acción.'
    in_word: en
    aria_query: 'Consulta de búsqueda'
    aria_category: Categoría
    button_submit: Buscar
  example:
    page_title: 'Formulario de ejemplo - Demo Form Kit'
    heading: 'Formulario de ejemplo'
    intro: 'Tarjeta con cuadrícula: dos columnas para contacto, ancho completo para asunto y mensaje. Convenciones (<code>example_form.*</code>).'
    send: Enviar
    send_copy: 'Enviar copia'
    submitted_line: 'nombre = %name%, email = %email%, asunto = %subject%'
  dropzone:
    page_title: 'Dropzone - Demo Form Kit'
    heading: 'Dropzone (Symfony UX)'
    intro: 'Capa de tipo personalizada: <code>DropzoneFieldType</code> extiende <code>AbstractFormKitWrappedType</code> y envuelve UX Dropzone. Etiqueta, placeholder y ayuda por convención (<code>dropzone_demo.document.*</code>).'
    default_image_heading: 'Imagen por defecto (desde public/images/demo-sample.jpg)'
    demo_sample_alt: 'Muestra demo'
    upload_button: Subir
    uploaded_prefix: Subido
  cropper:
    page_title: 'Recorte - Demo Form Kit'
    heading: 'Recorte (Symfony UX)'
    intro: 'Symfony UX Cropper.js: recorta una imagen con relación de aspecto fija. Tipo <code>cropper</code> en FormTypeMap del bundle si el paquete está instalado.'
    sample_missing_title: 'Falta la imagen de ejemplo.'
    sample_missing_body: 'Coloca una imagen en <code>public/images/demo-sample.jpg</code> para probar el recorte (por ejemplo copia un JPG o <code>cp public/images/demo-sample.png public/images/demo-sample.jpg</code> si tienes PNG).'
    expected_path: 'Ruta esperada:'
    crop_submitted_title: 'Recorte enviado.'
    crop_submitted_body: 'En una app real guardarías la imagen recortada con <code>$crop->getCroppedImage()</code> o <code>getCroppedThumbnail()</code>.'
  translations:
    page_title: 'Traducciones - Demo Form Kit'
    heading: Traducciones
    intro: 'A2lix <code>TranslationsFormsType</code> con <code>form_type</code> = TranslationItemType. <code>TranslationsDemoType</code> implementa <code>resolveFormKitTranslationsLocaleContext()</code> y usa <code>DemoTranslationLocales::forSession()</code>: un <strong>subconjunto aleatorio</strong> de idiomas (<code>en</code>, <code>es</code>, <code>fr</code>, <code>de</code>) se guarda en sesión para que el número de pestañas cambie entre sesiones, manteniendo coherencia en GET/POST. <code>DemoTranslatableItem::forLocales()</code> coincide con esas claves.'
    locale_pool_hint: 'Idiomas activos en esta sesión: %pool%.'
    reshuffle: 'Elegir otro conjunto aleatorio'
  nested:
    page_title: 'Formulario anidado - Demo Form Kit'
    heading: 'Formulario anidado'
    intro: 'Formulario con subformulario: contacto (nombre, email) + dirección (calle, número, piso, CP, ciudad, provincia). Mismas convenciones Form Kit.'
    section_contact: Contacto
    section_address: Dirección
  data_transformers:
    page_title: 'Transformadores de datos - Demo Form Kit'
    heading: 'Transformadores de datos'
    intro: 'Cada campo usa un <strong>transformador de modelo</strong> para que el PHP guarde valores aptos para persistencia (céntimos, arrays, 1/0) y el HTML muestre valores legibles (decimales, JSON, CSV, casilla, interruptor).'
    usage_1: '<code>DataTransformersDemoType</code> llama a <code>addMoneyType()</code>, <code>addJsonType()</code>, <code>addCsvType()</code>, <code>addBoolType()</code> y <code>addSwitchType()</code> de <code>FormOptionsTrait</code>.'
    usage_2: 'Tras un envío válido, el <code>DataTransformersDemoData</code> normalizado debajo es lo que persistirías (sin parsear cadenas en el controlador).'
    normalized_title: 'Modelo normalizado (datos enviados)'
  choice_fields:
    page_title: 'Campos de elección - Demo Form Kit'
    heading: 'Campos de elección'
    intro: 'Helpers de <code>FormOptionsTrait</code> y <code>FormKitControllerTrait</code> sobre <code>ChoiceType</code> (select, multiselect, radios, grupo de casillas) y <code>addMultiSelectSelectAll()</code> con <strong>nowo-tech/select-all-choice-bundle</strong>.'
    usage_1: '<code>addSelect()</code>, <code>addMultiSelect()</code>, <code>addChoiceRadios()</code>, <code>addChoiceCheckboxes()</code>, <code>addCheckbox()</code>.'
    usage_2: 'Opcional <code>addMultiSelectSelectAll()</code> activa la UI <code>select_all</code> (demos Symfony 7/8; incluye <code>select-all-choice.js</code> en el layout).'
    usage_3: 'Para Symfony UX Autocomplete, usa <code>addAutocompleteField()</code> / <code>addAutocompleteFieldType()</code> con el FQCN de tu tipo de formulario.'
    normalized_title: 'Datos enviados (normalizados)'
  ckeditor:
    page_title: 'CKEditor - Demo Form Kit'
    heading: CKEditor
    intro: 'Texto enriquecido con <strong>FOSCKEditorBundle</strong> (CKEditor 4). Usa <code>addCKEditorField()</code> / <code>addCKEditorFieldType()</code> para las mismas convenciones Form Kit. Ejecuta <code>composer require friendsofsymfony/ckeditor-bundle</code> y <code>bin/console ckeditor:install</code>.'
    usage_1: 'Dos campos: configuración por defecto (barra <code>standard</code>) y segunda configuración (<code>minimal</code> → barra <code>basic</code>) con <code>config_name</code>.'
    usage_2: 'Los assets de CKEditor quedan en <code>public/bundles/fosckeditor/</code> tras instalar y <code>assets:install</code>.'
    normalized_title: 'Datos enviados (normalizados)'
  ux_autocomplete:
    page_title: 'UX Autocomplete - Demo Form Kit'
    heading: 'UX Autocomplete'
    intro: 'Demo en vivo de <strong>Symfony UX Autocomplete</strong> (Tom Select) sobre <code>ChoiceType</code>: opciones locales con búsqueda. Form Kit usa <code>addAutocompleteField($builder, ''nombre'', ChoiceType::class, [''autocomplete'' =&gt; true, …])</code> con las mismas convenciones de etiquetas/ayuda.'
    usage_1: 'Campo <code>topic</code> (opcional): una opción de una lista corta.'
    usage_2: 'Campo <code>skills</code>: multiselección con <code>multiple =&gt; true</code> y <code>autocomplete =&gt; true</code>.'
    usage_3: 'Para búsqueda Ajax de entidades, instala Doctrine y un tipo que extienda <code>BaseEntityAutocompleteType</code> (<a href="https://symfony.com/bundles/ux-autocomplete/current/index.html" rel="noopener">documentación</a>); pasa ese FQCN a <code>addAutocompleteField()</code>.'
    normalized_title: 'Datos enviados (normalizados)'
  multistep:
    page_title: 'Formulario por pasos - Demo Form Kit'
    heading: 'Formulario por pasos'
    intro: 'Asistente desde un array: contacto → dirección → confirmar. Convenciones por paso (<code>demo_wizard_contact.*</code>, <code>demo_wizard_address.*</code>).'
  multistep_summary:
    page_title: 'Resumen por pasos - Demo Form Kit'
    heading: 'Varios pasos — Resumen'

