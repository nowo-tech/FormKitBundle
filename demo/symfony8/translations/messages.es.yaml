      title: 'Campos de elección'
      description: 'Select, multiselect, radios, casillas, «Seleccionar todo» con <code>nowo-tech/select-all-choice-bundle</code> y helper de autocompletado (FQCN).'
      button: 'Abrir campos de elección'
    conditional_fields:
      title: 'Campos condicionales'
      description: 'Empresa o persona con <code>FormEvents</code> + <code>resolveFieldOptions()</code>, y también <code>if</code> en build-time.'
      button: 'Abrir campos condicionales'
    conditional_fields_live:
      title: 'Campos condicionales (Live)'
      description: 'El mismo formulario FormEvents dentro de un <code>Live Component</code> de Symfony UX.'
      button: 'Abrir condicionales Live'
