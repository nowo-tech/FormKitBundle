    form_type:
      title: FormType
      description: '<code>DemoContactType</code> avec <code>FormOptionsTrait</code>. Sections et grille.'
      button: 'Ouvrir FormType'
    controller_form:
      title: 'Formulaire dans le contrôleur'
      description: 'Construit dans le contrôleur avec <code>FormKitControllerTrait</code> (texte, e-mail, textarea, <strong>interrupteur</strong>). Deux colonnes.'
      button: 'Ouvrir le formulaire contrôleur'
    search:
      title: Recherche
      description: 'Barre de recherche : requête + catégorie. Convention <code>search_form.*</code>.'
      button: 'Ouvrir la recherche'
    example_form:
      title: 'Formulaire exemple'
      description: 'Carte avec grille : nom, e-mail, sujet, message et actions.'
      button: 'Ouvrir l’exemple'
    dropzone:
      title: 'Dropzone (UX)'
      description: 'Symfony UX Dropzone : dépôt de fichiers par glisser-déposer.'
      button: 'Ouvrir Dropzone'
    cropper:
      title: 'Recadrage (UX)'
      description: 'Symfony UX Cropper.js : recadrer une image avec un ratio fixe.'
      button: 'Ouvrir le recadrage'
    translations:
      title: Traductions
      description: 'Champs par langue avec onglets. Un form_class par langue.'
      button: 'Ouvrir les traductions'
    nested:
      title: 'Formulaire imbriqué'
      description: 'Contact + adresse imbriquée. Conventions Form Kit pour les types imbriqués.'
      button: 'Ouvrir l’imbriqué'
    data_transformers:
      title: 'Transformateurs de données'
      description: 'Argent, JSON, CSV, booléen et interrupteur via les transformateurs de modèle de <code>FormOptionsTrait</code>.'
      button: 'Ouvrir les transformateurs'
    choice_fields:
      title: 'Champs de choix'
      description: 'Select, multiselect, radios, cases, « Tout sélectionner » avec <code>nowo-tech/select-all-choice-bundle</code>, helper FQCN autocomplétion.'
      button: 'Ouvrir les champs de choix'
    conditional_fields:
      title: 'Champs conditionnels'
      description: 'Société ou personne avec <code>FormEvents</code> + <code>resolveFieldOptions()</code>, et <code>if</code> au build.'
      button: 'Ouvrir les champs conditionnels'
    conditional_fields_live:
      title: 'Champs conditionnels (Live)'
      description: 'Le même formulaire FormEvents dans un <code>Live Component</code> Symfony UX.'
      button: 'Ouvrir conditionnels Live'
    kit_api_patterns:
      title: 'Motifs API Kit'
      description: '<code>FormKitAbstractType</code> (snake_case) et config nommée <code>#[FormKitConfig]</code>.'
      button: 'Ouvrir les motifs API'
    ckeditor:
      title: CKEditor
      description: 'FOSCKEditorBundle (CKEditor 4) : texte enrichi avec <code>addCKEditorField()</code> et configurations de barre.'
      button: 'Ouvrir CKEditor'
    ux_autocomplete:
      title: Autocomplétion
      description: '<strong>Symfony UX Autocomplete</strong> (Tom Select) : <code>ChoiceType</code> avec <code>autocomplete =&gt; true</code> et <code>addAutocompleteField()</code>.'
      button: 'Ouvrir l’autocomplétion'
    multistep:
      title: 'Plusieurs étapes'
      description: 'Assistant depuis un tableau : contact → adresse → confirmation. Étapes en session.'
      button: 'Ouvrir l’assistant'
    nowo_special_fields:
      title: 'Champs spéciaux Nowo'
      description: 'Widgets de l’écosystème : OTP, téléphone, mot de passe avec bascule/force, sélecteur d’icônes, Tiptap, CKEditor 5 — via <code>addWithDefaults()</code> et conventions Form Kit.'
      button: 'Ouvrir les champs Nowo'
  form_type:
    page_title: 'Exemple FormType - Démo Form Kit'
    heading: 'Exemple FormType'
    intro: 'Formulaire défini dans <code>App\Form\DemoContactType</code> avec <code>FormOptionsTrait</code>. Mise en page par sections et grille.'
    usage_1: '<code>DemoContactType</code> utilise <code>FormOptionsTrait</code> et <code>buildFormFromArray()</code> ; <code>FormOptionsMerger</code> est injecté par le compiler pass du bundle.'
    usage_2: 'Convention : libellés, placeholders et aide via <code>demo_contact.champ.label</code>, <code>.placeholder</code>, <code>.help</code> dans le domaine de traduction.'
    usage_3: 'Pas besoin de configurer chaque type à la main : un FormType avec le trait et les traductions suffisent.'
  controller_form:
    page_title: 'Formulaire contrôleur - Démo Form Kit'
    heading: 'Exemple de formulaire dans le contrôleur'
    intro: 'Formulaire créé dans <code>FormKitDemoController::createControllerForm()</code> avec les helpers <code>FormKitControllerTrait</code> (<code>addTextType</code>, …, <code>addSwitchType</code>). Mêmes conventions ; deux colonnes + message pleine largeur + interrupteur.'
    usage_1: 'Le contrôleur injecte <code>FormOptionsMerger</code> et <code>FormTypeMap</code> et utilise <code>add*Type()</code> (même fusion que les FormType avec le trait).'
    usage_2: 'Convention : clés <code>controller_contact.name</code>, <code>.email</code>, <code>.message</code>, <code>.notify_switch.*</code> pour libellé / placeholder / aide.'
    usage_3: 'Utile lorsque le formulaire est créé dans le contrôleur (sans classe FormType) mais que vous voulez les mêmes conventions du bundle.'
  search:
    page_title: 'Recherche - Démo Form Kit'
    heading: Recherche
    intro: 'Barre de recherche avec conventions Form Kit (<code>search_form.*</code>). Même formulaire, autre mise en page : barre avec filtre et action.'
    in_word: dans
    aria_query: 'Requête de recherche'
    aria_category: Catégorie
    button_submit: Rechercher
  example:
    page_title: 'Formulaire exemple - Démo Form Kit'
    heading: 'Formulaire exemple'
    intro: 'Carte avec grille : deux colonnes pour le contact, pleine largeur pour le sujet et le message. Conventions (<code>example_form.*</code>).'
    send: Envoyer
    send_copy: 'Envoyer une copie'
    submitted_line: 'nom = %name%, e-mail = %email%, sujet = %subject%'
  dropzone:
    page_title: 'Dropzone - Démo Form Kit'
    heading: 'Dropzone (Symfony UX)'
    intro: 'Couche de type personnalisée : <code>DropzoneFieldType</code> étend <code>AbstractFormKitWrappedType</code> et enveloppe UX Dropzone. Libellé, placeholder et aide par convention (<code>dropzone_demo.document.*</code>).'
    default_image_heading: 'Image par défaut (depuis public/images/demo-sample.jpg)'
    demo_sample_alt: 'Échantillon démo'
    upload_button: Téléverser
    uploaded_prefix: Téléversé
  cropper:
    page_title: 'Recadrage - Démo Form Kit'
    heading: 'Recadrage (Symfony UX)'
    intro: 'Symfony UX Cropper.js : recadrer une image avec un ratio fixe. Type <code>cropper</code> dans le FormTypeMap du bundle si le paquet est installé.'
    sample_missing_title: 'Image d’exemple manquante.'
    sample_missing_body: 'Placez une image dans <code>public/images/demo-sample.jpg</code> pour tester le recadrage (par ex. copiez un JPG ou <code>cp public/images/demo-sample.png public/images/demo-sample.jpg</code> si vous avez un PNG).'
    expected_path: 'Chemin attendu :'
    crop_submitted_title: 'Recadrage envoyé.'
    crop_submitted_body: 'Dans une vraie application vous enregistreriez l’image via <code>$crop->getCroppedImage()</code> ou <code>getCroppedThumbnail()</code>.'
  translations:
    page_title: 'Traductions - Démo Form Kit'
    heading: Traductions
    intro: 'A2lix <code>TranslationsFormsType</code> avec <code>form_type</code> = TranslationItemType. <code>TranslationsDemoType</code> implémente <code>resolveFormKitTranslationsLocaleContext()</code> et utilise <code>DemoTranslationLocales::forSession()</code> : un <strong>sous-ensemble aléatoire</strong> de langues (<code>en</code>, <code>es</code>, <code>fr</code>, <code>de</code>) est stocké en session pour que le nombre d’onglets change entre sessions, tout en restant cohérent entre GET et POST. <code>DemoTranslatableItem::forLocales()</code> suit ces clés.'
    locale_pool_hint: 'Langues actives pour cette session : %pool%.'
    reshuffle: 'Tirer un autre ensemble au hasard'
  nested:
    page_title: 'Formulaire imbriqué - Démo Form Kit'
    heading: 'Formulaire imbriqué'
    intro: 'Formulaire avec sous-formulaire : contact (nom, e-mail) + adresse (rue, numéro, étage, code postal, ville, province). Mêmes conventions Form Kit.'
    section_contact: Contact
    section_address: Adresse
  data_transformers:
    page_title: 'Transformateurs de données - Démo Form Kit'
    heading: 'Transformateurs de données'
    intro: 'Chaque champ utilise un <strong>transformateur de modèle</strong> : le PHP conserve des valeurs adaptées à la persistance (centimes, tableaux, 1/0) et le HTML affiche des valeurs lisibles (décimales, JSON, CSV, case, interrupteur).'
    usage_1: '<code>DataTransformersDemoType</code> appelle <code>addMoneyType()</code>, <code>addJsonType()</code>, <code>addCsvType()</code>, <code>addBoolType()</code> et <code>addSwitchType()</code> depuis <code>FormOptionsTrait</code>.'
    usage_2: 'Après une soumission valide, le <code>DataTransformersDemoData</code> normalisé ci-dessous est ce que vous persisteriez (sans analyse de chaînes dans le contrôleur).'
    normalized_title: 'Modèle normalisé (données soumises)'
  choice_fields:
    page_title: 'Champs de choix - Démo Form Kit'
    heading: 'Champs de choix'
    intro: 'Helpers sur <code>FormOptionsTrait</code> et <code>FormKitControllerTrait</code> pour <code>ChoiceType</code> (select, multiselect, radios, groupe de cases) et <code>addMultiSelectSelectAll()</code> avec <strong>nowo-tech/select-all-choice-bundle</strong>.'
    usage_1: '<code>addSelect()</code>, <code>addMultiSelect()</code>, <code>addChoiceRadios()</code>, <code>addChoiceCheckboxes()</code>, <code>addCheckbox()</code>.'
    usage_2: 'Option <code>addMultiSelectSelectAll()</code> : UI <code>select_all</code> (cette démo ; script <code>select-all-choice.js</code> dans le layout).'
    usage_3: 'Pour Symfony UX Autocomplete : <code>addAutocompleteField()</code> / <code>addAutocompleteFieldType()</code> avec le FQCN du type.'
    normalized_title: 'Données soumises (normalisées)'
  conditional_fields:
    page_title: 'Champs conditionnels - Démo Form Kit'
    heading: 'Champs conditionnels'
    intro: 'Sans option <code>when</code>. Gauche : événements + <code>resolveFieldOptions()</code>. Droite : <code>if</code> au build (<code>account_mode</code>).'
    usage_1: 'Événements : <code>ConditionalFieldsDemoType</code>.'
    usage_2: 'Build-time : <code>BuildTimeConditionalDemoType</code> (toggle query).'
    usage_3: 'Voir <code>docs/USAGE.md</code> — Conditional fields.'
    events_heading: 'FormEvents + resolveFieldOptions'
    events_intro: 'Champs ajoutés/retirés selon les données.'
    build_heading: 'if au build'
    build_intro: 'Forme fixe à la création ; toggle pour changer <code>account_mode</code>.'
    normalized_title: 'Données soumises (normalisées)'
  conditional_fields_live:
    page_title: 'Champs conditionnels (Live) - Démo Form Kit'
    heading: 'Champs conditionnels (Live Component)'
    intro: 'Enveloppe <code>ConditionalFieldsDemoType</code> dans <code>ComponentWithFormTrait</code>.'
    usage_1: 'Composant : <code>App\Twig\Components\ConditionalFieldsLive</code>.'
    usage_2: 'Nécessite <code>symfony/ux-live-component</code>.'
    usage_3: 'Comparer avec <code>/conditional-fields</code>.'
    component_intro: 'Changez le <strong>type de compte</strong> — les champs se mettent à jour sans rechargement complet.'
  kit_api_patterns:
    page_title: 'Motifs API Kit - Démo Form Kit'
    heading: 'Motifs API Kit'
    intro: '<code>FormKitAbstractType</code> / snake_case, <code>withBuilder</code>, profil YAML <code>bootstrap</code>.'
    usage_1: 'Gauche : <code>SnakeCaseKitDemoType</code>.'
    usage_2: 'Droite : <code>NamedConfigDemoType</code> + <code>#[FormKitConfig(''bootstrap'')]</code>.'
    usage_3: '<code>internal_code</code> désactive la convention.'
    snake_heading: 'FormKitTrait (snake_case)'
    snake_intro: 'Types via <code>FormTypeMap</code>.'
    named_heading: 'Config nommée (bootstrap)'
    named_intro: 'Comparer la taille des contrôles avec le profil default.'
  ckeditor:
    page_title: 'CKEditor - Démo Form Kit'
    heading: CKEditor
    intro: 'Texte enrichi avec <strong>FOSCKEditorBundle</strong> (CKEditor 4). Utilisez <code>addCKEditorField()</code> / <code>addCKEditorFieldType()</code> pour les mêmes conventions Form Kit. Exécutez <code>composer require friendsofsymfony/ckeditor-bundle</code> puis <code>bin/console ckeditor:install</code>.'
    usage_1: 'Deux champs : configuration par défaut (barre <code>standard</code>) et seconde configuration (<code>minimal</code> → barre <code>basic</code>) via <code>config_name</code>.'
    usage_2: 'Les assets CKEditor sont publiés sous <code>public/bundles/fosckeditor/</code> après installation et <code>assets:install</code>.'
    normalized_title: 'Données soumises (normalisées)'
  ux_autocomplete:
    page_title: 'UX Autocomplete - Démo Form Kit'
    heading: 'UX Autocomplete'
    intro: 'Démo <strong>Symfony UX Autocomplete</strong> (Tom Select) sur <code>ChoiceType</code> : choix locaux avec recherche. Form Kit utilise <code>addAutocompleteField($builder, ''nom'', ChoiceType::class, [''autocomplete'' =&gt; true, …])</code> avec les mêmes conventions de libellés.'
    usage_1: 'Champ <code>topic</code> (optionnel) : un choix dans une petite liste.'
    usage_2: 'Champ <code>skills</code> : multi-sélection avec <code>multiple =&gt; true</code> et <code>autocomplete =&gt; true</code>.'
    usage_3: 'Pour la recherche Ajax d’entités, ajoutez Doctrine et un type étendant <code>BaseEntityAutocompleteType</code> (<a href="https://symfony.com/bundles/ux-autocomplete/current/index.html" rel="noopener">doc</a>) ; passez son FQCN à <code>addAutocompleteField()</code>.'
    normalized_title: 'Données soumises (normalisées)'
  multistep:
    page_title: 'Formulaire multi-étapes - Démo Form Kit'
    heading: 'Formulaire multi-étapes'
    intro: 'Assistant depuis un tableau : contact → adresse → confirmation. Conventions par étape (<code>demo_wizard_contact.*</code>, <code>demo_wizard_address.*</code>).'
  multistep_summary:
    page_title: 'Résumé multi-étapes - Démo Form Kit'
    heading: 'Multi-étapes — Résumé'
  nowo_special_fields:
    page_title: 'Champs spéciaux Nowo - Démo Form Kit'
    heading: 'Champs spéciaux Nowo'
    intro: 'Présentation des widgets de formulaire de l’écosystème <strong>nowo-tech</strong> intégrés via <code>FormOptionsTrait::addWithDefaults()</code> — mêmes clés de traduction et pipeline de fusion que les helpers intégrés.'
    usage_1: '<code>nowo-tech/otp-input-bundle</code> (chiffres OTP), <code>phone-input-bundle</code> (E.164 + sélecteur de pays), <code>password-toggle-bundle</code> et <code>password-strength-bundle</code>.'
