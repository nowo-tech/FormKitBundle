demo_wizard_nav:
  contact: Contact
  address: Address
  confirm: Confirm

demo_pages:
  layout:
    default_title: 'Form Kit Bundle Demo'
  common:
    back: Back
    submit: Submit
    save: Save
    submitted: Submitted
    finish: Finish
    next: Next
    start_over: Start over
    collected_data: 'Collected data'
    bundle_usage: 'Bundle usage'
    crop: Crop
  index:
    title: 'Form Kit Bundle Demo'
    intro: 'Convention-based form options with flexible layouts. Each card links to a dedicated page with the form and an explanation of how it is built with the bundle.'
  index_cards:
    form_type:
      title: FormType
      description: '<code>DemoContactType</code> with <code>FormOptionsTrait</code>. Sections and grid layout.'
      button: 'Open FormType'
    controller_form:
      title: 'Controller Form'
      description: 'Built in the controller with <code>FormKitControllerTrait</code> (text, email, textarea, <strong>switch</strong>). Two-column layout.'
      button: 'Open Controller Form'
    search:
      title: 'Search Form'
      description: 'Inline search bar: query + category filter. Convention <code>search_form.*</code>.'
      button: 'Open Search'
    example_form:
      title: 'Example Form'
      description: 'Card with grid: name, email, subject, message and submit actions.'
      button: 'Open Example'
    dropzone:
      title: 'Dropzone (UX)'
      description: 'Symfony UX Dropzone: drag-and-drop file upload.'
      button: 'Open Dropzone'
    cropper:
      title: 'Cropper (UX)'
      description: 'Symfony UX Cropper.js: crop an image with fixed aspect ratio.'
      button: 'Open Cropper'
    translations:
      title: Translations
      description: 'Translatable fields per locale with tabs. One form_class per locale.'
      button: 'Open Translations'
    nested:
      title: 'Nested Form'
      description: 'Contact + embedded address. Form Kit conventions for nested types.'
      button: 'Open Nested'
    data_transformers:
      title: 'Data transformers'
      description: 'Money, JSON, CSV, bool and switch presets via <code>FormOptionsTrait</code> model transformers.'
      button: 'Open Data transformers'
    choice_fields:
      title: 'Choice fields'
      description: 'Select, multiselect, radios, checkboxes, optional Select all via <code>nowo-tech/select-all-choice-bundle</code>, and autocomplete FQCN helper.'
      button: 'Open Choice fields'
    ckeditor:
      title: CKEditor
      description: 'FOSCKEditorBundle (CKEditor 4): rich text with <code>addCKEditorField()</code> and named toolbar configs.'
      button: 'Open CKEditor'
    ux_autocomplete:
      title: Autocomplete
      description: '<strong>Symfony UX Autocomplete</strong> (Tom Select): <code>ChoiceType</code> with <code>autocomplete =&gt; true</code> and <code>addAutocompleteField()</code>.'
      button: 'Open Autocomplete'
    multistep:
      title: Multi-step
      description: 'Wizard from array: contact → address → confirm. Session-based steps.'
      button: 'Open Multi-step'
    nowo_special_fields:
      title: 'Nowo special fields'
      description: 'Ecosystem widgets: OTP, phone, password toggle/strength, icon selector, Tiptap, CKEditor 5 — all via <code>addWithDefaults()</code> and Form Kit conventions.'
      button: 'Open Nowo fields'
  form_type:
    page_title: 'FormType Example - Form Kit Demo'
    heading: 'FormType Example'
    intro: 'Form defined in <code>App\Form\DemoContactType</code> with <code>FormOptionsTrait</code>. Layout: sections and two-column grid to show how the same form can be structured for clarity.'
    usage_1: '<code>DemoContactType</code> uses <code>FormOptionsTrait</code> and <code>buildFormFromArray()</code>; <code>FormOptionsMerger</code> is injected by the bundle’s compiler pass.'
    usage_2: 'Convention: labels, placeholders and help come from keys <code>demo_contact.field.label</code>, <code>.placeholder</code>, <code>.help</code> in the configured translation domain.'
    usage_3: 'No need to configure each type by hand: one form type with the trait and translations handle the rest.'
  controller_form:
    page_title: 'Controller Form Example - Form Kit Demo'
    heading: 'Controller Form Example'
    intro: 'Form built in <code>FormKitDemoController::createControllerForm()</code> with <code>FormKitControllerTrait</code> helpers (<code>addTextType</code>, …, <code>addSwitchType</code>). Same convention-based labels/placeholders; layout: two columns + full-width message + switch.'
    usage_1: 'The controller injects <code>FormOptionsMerger</code> and <code>FormTypeMap</code> and calls <code>add*Type()</code> helpers (same merge as FormTypes with the trait).'
    usage_2: 'Convention: keys <code>controller_contact.name</code>, <code>.email</code>, <code>.message</code>, <code>.notify_switch.*</code> for label/placeholder/help.'
    usage_3: 'Useful when the form is built in the controller (no FormType class) but you want the same bundle conventions.'
  search:
    page_title: 'Search Form - Form Kit Demo'
    heading: 'Search Form'
    intro: 'Inline search bar using Form Kit conventions (<code>search_form.*</code>). Same form, different layout: single bar with filter and action.'
    in_word: in
    aria_query: 'Search query'
    aria_category: Category
    button_submit: Search
  example:
    page_title: 'Example Form - Form Kit Demo'
    heading: 'Example Form'
    intro: 'Card layout with grid: two columns for contact fields, full width for subject and message. Form Kit conventions (<code>example_form.*</code>).'
    send: Send
    send_copy: 'Send copy'
    submitted_line: 'name = %name%, email = %email%, subject = %subject%'
  dropzone:
    page_title: 'Dropzone - Form Kit Demo'
    heading: 'Dropzone (Symfony UX)'
    intro: 'Uses the bundle with a <strong>custom type layer</strong>: <code>DropzoneFieldType</code> extends <code>AbstractFormKitWrappedType</code> and wraps UX Dropzone. Label, placeholder and help come from convention (<code>dropzone_demo.document.*</code>).'
    default_image_heading: 'Default image (from public/images/demo-sample.jpg)'
    demo_sample_alt: 'Demo sample'
    upload_button: Upload
    uploaded_prefix: Uploaded
  cropper:
    page_title: 'Cropper - Form Kit Demo'
    heading: 'Cropper (Symfony UX)'
    intro: 'Symfony UX Cropper.js: crop an image with a fixed aspect ratio. Usable as <code>cropper</code> type in Form Kit’s FormTypeMap when the package is installed.'
    sample_missing_title: 'Sample image missing.'
    sample_missing_body: 'Place an image at <code>public/images/demo-sample.jpg</code> to try the cropper (e.g. copy any JPG there or run <code>cp public/images/demo-sample.png public/images/demo-sample.jpg</code> if you have a PNG).'
    expected_path: 'Expected path:'
    crop_submitted_title: 'Crop submitted.'
    crop_submitted_body: 'In a real app you would save the cropped image via <code>$crop->getCroppedImage()</code> or <code>getCroppedThumbnail()</code>.'
  translations:
    page_title: 'Translations - Form Kit Demo'
    heading: Translations
    intro: 'A2lix <code>TranslationsFormsType</code> with <code>form_type</code> = TranslationItemType. <code>TranslationsDemoType</code> implements <code>resolveFormKitTranslationsLocaleContext()</code> and uses <code>DemoTranslationLocales::forSession()</code>: a <strong>random subset</strong> of locales (<code>en</code>, <code>es</code>, <code>fr</code>, <code>de</code>) is stored in the session so the tab count changes between sessions, while GET/POST stay consistent. <code>DemoTranslatableItem::forLocales()</code> matches those keys.'
    locale_pool_hint: 'Enabled locales for this session: %pool%.'
    reshuffle: 'Reshuffle locales'
  nested:
    page_title: 'Nested Form - Form Kit Demo'
    heading: 'Nested Form'
    intro: 'Form with embedded nested form: contact (name, email) + address (street, number, floor, postal code, city, province). Same Form Kit conventions for parent and nested type.'
    section_contact: Contact
    section_address: Address
  data_transformers:
    page_title: 'Data transformers - Form Kit Demo'
    heading: 'Data transformers'
    intro: 'Each field uses a <strong>model transformer</strong> so the PHP model stays in a storage-friendly shape (cents, arrays, 1/0) while the HTML widget shows a human-friendly value (decimals, JSON, CSV, checkbox, switch).'
    usage_1: '<code>DataTransformersDemoType</code> calls <code>addMoneyType()</code>, <code>addJsonType()</code>, <code>addCsvType()</code>, <code>addBoolType()</code> and <code>addSwitchType()</code> from <code>FormOptionsTrait</code>.'
    usage_2: 'After a valid submit, the normalized <code>DataTransformersDemoData</code> below matches what you would persist (no string parsing left in the controller).'
    normalized_title: 'Normalized model (submitted data)'
  choice_fields:
    page_title: 'Choice fields - Form Kit Demo'
    heading: 'Choice fields'
    intro: 'Helpers on <code>FormOptionsTrait</code> and <code>FormKitControllerTrait</code> wrap <code>ChoiceType</code> presets (select, multiselect, radios, checkbox group) and a dedicated <code>addMultiSelectSelectAll()</code> when <strong>nowo-tech/select-all-choice-bundle</strong> (Select All Choice) is installed.'
    usage_1: '<code>addSelect()</code>, <code>addMultiSelect()</code>, <code>addChoiceRadios()</code>, <code>addChoiceCheckboxes()</code>, <code>addCheckbox()</code>.'
    usage_2: 'Optional <code>addMultiSelectSelectAll()</code> enables the bundle’s <code>select_all</code> UI (demo Symfony 7/8 only; load <code>select-all-choice.js</code> in the layout).'
    usage_3: 'For Symfony UX Autocomplete (entity field classes), use <code>addAutocompleteField()</code> / <code>addAutocompleteFieldType()</code> with your FormType FQCN.'
    normalized_title: 'Submitted data (normalized)'
  ckeditor:
    page_title: 'CKEditor - Form Kit Demo'
    heading: CKEditor
    intro: 'Rich text with <strong>FOSCKEditorBundle</strong> (CKEditor 4). Use <code>addCKEditorField()</code> / <code>addCKEditorFieldType()</code> so the same Form Kit conventions apply (labels, help, row attr). Run <code>composer require friendsofsymfony/ckeditor-bundle</code> and <code>bin/console ckeditor:install</code>.'
    usage_1: 'Two fields: default config (<code>standard</code> toolbar) and a second config (<code>minimal</code> → <code>basic</code> toolbar) via <code>config_name</code>.'
    usage_2: 'CKEditor assets are published under <code>public/bundles/fosckeditor/</code> after install and <code>assets:install</code>.'
    normalized_title: 'Submitted data (normalized)'
  ux_autocomplete:
    page_title: 'UX Autocomplete - Form Kit Demo'
    heading: 'UX Autocomplete'
    intro: 'Live <strong>Symfony UX Autocomplete</strong> (Tom Select) on <code>ChoiceType</code>: local choices with search UI. Form Kit uses <code>addAutocompleteField($builder, ''name'', ChoiceType::class, [''autocomplete'' =&gt; true, …])</code> — same label/placeholder/help conventions as other helpers.'
    usage_1: 'Single field <code>topic</code> (optional): one choice from a small list.'
    usage_2: 'Field <code>skills</code>: multi-select with <code>multiple =&gt; true</code> and <code>autocomplete =&gt; true</code>.'
    usage_3: 'For Ajax entity search, install Doctrine and add a type extending <code>BaseEntityAutocompleteType</code> (see <a href="https://symfony.com/bundles/ux-autocomplete/current/index.html" rel="noopener">UX Autocomplete doc</a>); then pass that FQCN to <code>addAutocompleteField()</code>.'
    normalized_title: 'Submitted data (normalized)'
  multistep:
    page_title: 'Multi-step Form - Form Kit Demo'
    heading: 'Multi-step Form'
    intro: 'Wizard built from an array: contact → address → confirm. Same Form Kit conventions per step (<code>demo_wizard_contact.*</code>, <code>demo_wizard_address.*</code>).'
  multistep_summary:
    page_title: 'Multi-step Summary - Form Kit Demo'
    heading: 'Multi-step — Summary'
  nowo_special_fields:
    page_title: 'Nowo special fields - Form Kit Demo'
    heading: 'Nowo special fields'
    intro: 'Showcase of <strong>nowo-tech</strong> ecosystem form widgets wired through <code>FormOptionsTrait::addWithDefaults()</code> — same translation keys and merge pipeline as built-in helpers.'
    usage_1: '<code>nowo-tech/otp-input-bundle</code> (OTP digits), <code>phone-input-bundle</code> (E.164 + country selector), <code>password-toggle-bundle</code> and <code>password-strength-bundle</code>.'
    usage_2: '<code>icon-selector-bundle</code> (Tom Select + icons), <code>tiptap-editor-bundle</code> and <code>ckeditor5-editor-bundle</code> for rich text (GPL CKEditor 5).'
    usage_3: 'Also available elsewhere in this demo: <code>select-all-choice-bundle</code>, FOS CKEditor 4, UX Autocomplete, Dropzone, Cropper, A2lix translations.'
    normalized_title: 'Submitted data (normalized)'

