# Form Kit Bundle — demo configuration (see bundle docs: docs/CONFIGURATION.md).
#
# Top-level:
#   default_config — Config block used when a form does not call setFormKitConfigName().
#   type_map       — Optional snake_case => FQCN; merged with built-in and optional UX types.
#   configs        — Named profiles (translation domain, defaults, help_modal, field_types).

nowo_form_kit:
    default_config: default

    # Optional: extra types for FormKitTrait / snake_case fields (uncomment if you add custom types).
    # type_map:
    #     my_custom: 'App\Form\Type\MyCustomType'

    configs:
        default:
            alias: default
            translation_domain: messages

            # Suffix for required field labels (RequiredLabelSuffixExtension reads `default_config` only).
            required_label_suffix: ' *'

            defaults:
                attr:
                    class: 'form-control'
                row_attr:
                    class: 'mb-3'

            # Defaults when help_modal: true on a field (HelpModalExtension + public/help-modal.js).
            help_modal:
                framework: bootstrap5
                icon_html: '<span class="nowo-help-modal-icon" aria-hidden="true">?</span>'

            # Per field type: attr, row_attr, label, placeholder, help, translation_domain (see CONFIGURATION.md).
            field_types: {}
            # Example overrides:
            # field_types:
            #     text:
            #         attr: { class: 'form-control' }
            #     checkbox:
            #         attr: { class: 'form-check-input' }
            #         row_attr: { class: 'form-check mb-3' }
            #     choice:
            #         attr: { class: 'form-select' }

        # Optional second profile — wire via setFormKitConfigName('bootstrap') on the form type service.
        # bootstrap:
        #     alias: bootstrap
        #     translation_domain: messages
        #     required_label_suffix: ' *'
        #     defaults:
        #         attr: { class: 'form-control form-control-lg' }
        #         row_attr: { class: 'mb-3' }
        #     help_modal:
        #         framework: bootstrap5
        #         icon_html: '<span class="nowo-help-modal-icon" aria-hidden="true">?</span>'
        #     field_types: {}

# Legacy (single implicit config without `configs`): supported but not used in this demo.
# nowo_form_kit:
#     translation_domain: messages
#     required_label_suffix: null
#     help_modal: { framework: bootstrap5, icon_html: '<span class="nowo-help-modal-icon" aria-hidden="true">?</span>' }
#     defaults: { attr: { class: form-control }, row_attr: { class: mb-3 } }
#     field_types: {}
#     type_map: {}
