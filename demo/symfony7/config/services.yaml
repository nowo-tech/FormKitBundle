services:
  _defaults:
    autowire: true
    autoconfigure: true

  # A2lix TranslationsType uses abstract args that need explicit binding in demos.
  a2lix_translation_form.form.type.translations_type:
    class: A2lix\TranslationFormBundle\Form\Type\TranslationsType
    arguments:
      - []
      - []
    tags: ['form.type']

  App\:
    resource: '../src/'
    exclude:
      - '../src/Kernel.php'

  # Must be after App\: import — otherwise PSR-4 discovery overwrites this and $enabledLocales is lost.
  App\EventSubscriber\LocaleSubscriber:
    arguments:
      $enabledLocales: '%kernel.enabled_locales%'
