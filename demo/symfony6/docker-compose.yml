name: form-kit-bundle-demo-symfony-6
services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: form-kit-demo-symfony6-php
    working_dir: /app
    restart: unless-stopped
    volumes:
      - .:/app
      - ../..:/var/form-kit-bundle
      - ./docker/frankenphp/Caddyfile.dev:/etc/frankenphp/Caddyfile.dev
      - ./docker/php-dev.ini:/usr/local/etc/php/conf.d/99-dev.ini:ro
      - composer-cache:/root/.composer/cache
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      - APP_ENV=dev
      - APP_DEBUG=1
      - APP_SECRET=${APP_SECRET:-demo-secret}
    # Mitigate Docker/WSL DNS failures resolving repo.packagist.org (composer curl error 6).
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "${PORT:-8006}:80"
    networks:
      - form-kit-demo-network

volumes:
  composer-cache:
    driver: local

networks:
  form-kit-demo-network:
    driver: bridge
